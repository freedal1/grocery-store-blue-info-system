<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Новый заказ')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-cart-plus me-2"></i>Создание нового заказа</h4>
                    </div>
                    <div class="card-body text-center py-5">
                        <i class="bi bi-cart-plus display-1 text-primary mb-4 d-block"></i>
                        <h5 class="mb-3">Начать оформление заказа</h5>
                        <p class="text-muted mb-4">После создания заказа вы сможете добавить товары в корзину</p>
                        <form th:action="@{/orders/new}" method="post">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-plus-lg me-2"></i>Создать заказ
                            </button>
                        </form>
                    </div>
                </div>
                
                <div class="mt-4 text-center">
                    <a th:href="@{/products}" class="btn btn-outline-secondary me-2">
                        <i class="bi bi-box-seam me-2"></i>Каталог товаров
                    </a>
                    <a th:href="@{/orders/my}" class="btn btn-outline-secondary">
                        <i class="bi bi-bag me-2"></i>Мои заказы
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
