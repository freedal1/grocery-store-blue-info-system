<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.id != null} ? 'Редактирование товара' : 'Новый товар')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Навигация -->
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/products}">Товары</a></li>
                        <li class="breadcrumb-item active" th:text="${product.id != null} ? 'Редактирование' : 'Новый товар'">Форма</li>
                    </ol>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="bi" th:classappend="${product.id != null} ? 'bi-pencil' : 'bi-plus-lg'"></i>
                            <span th:text="${product.id != null} ? 'Редактирование товара' : 'Добавление нового товара'">Форма товара</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Сообщение об ошибке -->
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}">Ошибка</span>
                        </div>

                        <form th:action="${product.id != null} ? @{/products/edit/{id}(id=${product.id})} : @{/products/new}" 
                              th:object="${product}" method="post">
                            
                            <div class="row">
                                <!-- Название -->
                                <div class="col-md-8 mb-3">
                                    <label for="name" class="form-label">Название товара *</label>
                                    <input type="text" class="form-control" id="name" th:field="*{name}"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           placeholder="Введите название товара" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <!-- Цена -->
                                <div class="col-md-4 mb-3">
                                    <label for="price" class="form-label">Цена (₽) *</label>
                                    <input type="number" step="0.01" min="0.01" class="form-control" id="price" th:field="*{price}"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                           placeholder="0.00" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Количество -->
                                <div class="col-md-4 mb-3">
                                    <label for="quantity" class="form-label">Количество *</label>
                                    <input type="number" min="0" class="form-control" id="quantity" th:field="*{quantity}"
                                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''"
                                           placeholder="0" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
                                </div>

                                <!-- Единица измерения -->
                                <div class="col-md-4 mb-3">
                                    <label for="unit" class="form-label">Единица измерения</label>
                                    <select class="form-select" id="unit" th:field="*{unit}">
                                        <option value="шт.">шт.</option>
                                        <option value="кг">кг</option>
                                        <option value="л">л</option>
                                        <option value="уп.">уп.</option>
                                        <option value="г">г</option>
                                        <option value="мл">мл</option>
                                    </select>
                                </div>

                                <!-- Штрих-код -->
                                <div class="col-md-4 mb-3">
                                    <label for="barcode" class="form-label">Штрих-код</label>
                                    <input type="text" class="form-control" id="barcode" th:field="*{barcode}"
                                           placeholder="Опционально">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Категория -->
                                <div class="col-md-6 mb-3">
                                    <label for="categoryId" class="form-label">Категория</label>
                                    <select class="form-select" id="categoryId" name="categoryId">
                                        <option value="">-- Выберите категорию --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                                th:selected="${product.category != null && product.category.id == cat.id}">Категория</option>
                                    </select>
                                </div>

                                <!-- Поставщик -->
                                <div class="col-md-6 mb-3">
                                    <label for="supplierId" class="form-label">Поставщик</label>
                                    <select class="form-select" id="supplierId" name="supplierId">
                                        <option value="">-- Выберите поставщика --</option>
                                        <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.companyName}"
                                                th:selected="${product.supplier != null && product.supplier.id == sup.id}">Поставщик</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Дата производства -->
                                <div class="col-md-6 mb-3">
                                    <label for="manufactureDate" class="form-label">Дата производства</label>
                                    <input type="date" class="form-control" id="manufactureDate" th:field="*{manufactureDate}">
                                </div>

                                <!-- Срок годности -->
                                <div class="col-md-6 mb-3">
                                    <label for="expirationDate" class="form-label">Срок годности до</label>
                                    <input type="date" class="form-control" id="expirationDate" th:field="*{expirationDate}">
                                </div>
                            </div>

                            <!-- Описание -->
                            <div class="mb-3">
                                <label for="description" class="form-label">Описание</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                          placeholder="Описание товара"></textarea>
                            </div>

                            <!-- Доступен -->
                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input" id="available" th:field="*{available}">
                                    <label class="form-check-label" for="available">Товар доступен для заказа</label>
                                </div>
                            </div>

                            <!-- Кнопки -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/products}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>Отмена
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-2"></i>
                                    <span th:text="${product.id != null} ? 'Сохранить изменения' : 'Добавить товар'">Сохранить</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
