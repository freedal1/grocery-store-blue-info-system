<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Каталог товаров')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <!-- Заголовок -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold" style="color: #1f2937;"><i class="bi bi-box-seam me-2" style="color: #6366f1;"></i>Каталог товаров</h2>
                <p style="color: #6b7280;" class="mb-0">Всего товаров: <span th:text="${products.totalElements}">0</span></p>
            </div>
            <div sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">
                <a th:href="@{/products/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-2"></i>Добавить товар
                </a>
            </div>
        </div>

        <!-- Сообщения -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i><span th:text="${success}">Успех</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}">Ошибка</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Фильтры -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/products}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" class="form-control" name="search" placeholder="Поиск товара..."
                                   th:value="${currentSearch}">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="categoryId">
                            <option value="">Все категории</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                    th:selected="${cat.id == currentCategoryId}">Категория</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="supplierId">
                            <option value="">Все поставщики</option>
                            <option th:each="sup : ${suppliers}" th:value="${sup.id}" th:text="${sup.companyName}"
                                    th:selected="${sup.id == currentSupplierId}">Поставщик</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="available">
                            <option value="">Все товары</option>
                            <option value="true" th:selected="${currentAvailable == true}">В наличии</option>
                            <option value="false" th:selected="${currentAvailable == false}">Нет в наличии</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" name="sortBy">
                            <option value="name" th:selected="${currentSortBy == 'name'}">По названию</option>
                            <option value="price" th:selected="${currentSortBy == 'price'}">По цене</option>
                            <option value="quantity" th:selected="${currentSortBy == 'quantity'}">По количеству</option>
                            <option value="createdAt" th:selected="${currentSortBy == 'createdAt'}">По дате</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-funnel"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Таблица товаров -->
        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Цена</th>
                                <th>Количество</th>
                                <th>Статус</th>
                                <th>Срок годности</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td th:text="${product.id}">1</td>
                                <td>
                                    <a th:href="@{/products/view/{id}(id=${product.id})}" 
                                       th:text="${product.name}" class="fw-semibold text-decoration-none">Товар</a>
                                </td>
                                <td th:text="${product.category?.name ?: '-'}">Категория</td>
                                <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')} + ' ₽'">0 ₽</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${product.quantity > 10} ? 'bg-success' : (${product.quantity > 0} ? 'bg-warning' : 'bg-danger')"
                                          th:text="${product.quantity} + ' ' + ${product.unit}">0 шт.</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${product.available} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${product.available} ? 'Доступен' : 'Недоступен'">Статус</span>
                                </td>
                                <td>
                                    <span th:if="${product.expirationDate != null}" 
                                          th:classappend="${product.expired} ? 'text-danger fw-bold' : (${product.expiringSoon} ? 'text-warning' : '')"
                                          th:text="${#temporals.format(product.expirationDate, 'dd.MM.yyyy')}">-</span>
                                    <span th:if="${product.expirationDate == null}">-</span>
                                    <span th:if="${product.expired}" class="badge bg-danger ms-1">Просрочен</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/products/view/{id}(id=${product.id})}" class="btn btn-outline-primary" title="Просмотр">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"
                                           th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-outline-warning" title="Редактировать">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form sec:authorize="hasAnyRole('MANAGER', 'ADMIN')"
                                              th:action="@{/products/delete/{id}(id=${product.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить этот товар?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Удалить">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${products.totalElements == 0}">
                                <td colspan="8" class="text-center py-5">
                                    <i class="bi bi-inbox display-4 text-muted d-block mb-3"></i>
                                    <p class="text-muted">Товары не найдены</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Пагинация -->
        <nav th:if="${products.totalPages > 1}" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${products.number - 1}, search=${currentSearch}, categoryId=${currentCategoryId}, sortBy=${currentSortBy})}">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" 
                    class="page-item" th:classappend="${i == products.number} ? 'active'">
                    <a class="page-link" th:href="@{/products(page=${i}, search=${currentSearch}, categoryId=${currentCategoryId}, sortBy=${currentSortBy})}" 
                       th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/products(page=${products.number + 1}, search=${currentSearch}, categoryId=${currentCategoryId}, sortBy=${currentSortBy})}">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
